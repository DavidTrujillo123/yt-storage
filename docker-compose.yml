services:
  redis:
    image: redis:7-alpine
    container_name: yt-storage-redis
    command: redis-server --save 60 1 --appendonly yes
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    image: yt-storage:latest
    container_name: yt-storage-api
    environment: &env
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      # Optional: empty means one is generated on first boot and kept in the
      # data volume, which is what lets this stack come up with no .env at all.
      SECRET_KEY: ${SECRET_KEY:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/accounts/callback}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      # Both services read the same values; only the api process seeds.
      SEED_ADMIN: ${SEED_ADMIN:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@yt-storage.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Abcd1234}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5368709120}
      # The channel's own cap on how long one video may be, which is what
      # decides whether a file is stored as one video or several: a group is a
      # second, so this is a size limit in disguise. Fifteen minutes is what an
      # unverified channel accepts — and past it `videos.insert` succeeds and
      # YouTube abandons the transcode, so guessing high is expensive. A
      # channel verified by phone accepts twelve hours: 43200.
      YOUTUBE_MAX_VIDEO_SECONDS: ${YOUTUBE_MAX_VIDEO_SECONDS:-900}
      # `aria2c` hands downloads to aria2, which asks for sixteen ranges at
      # once — the only thing measured to beat YouTube's per-connection
      # throttle. It costs the streaming decode: aria2 fills the file out of
      # order, so decoding waits for the download to finish. Empty or `none`
      # keeps yt-dlp's own downloader and the overlap.
      YTDLP_EXTERNAL_DOWNLOADER: ${YTDLP_EXTERNAL_DOWNLOADER:-}
      # Ranges of the video decoded at once. Defaults to half the cores, which
      # measured 613 seconds against 897 on a 2 GiB restore — a third of the
      # decode — for 1114% CPU against 225%. Set it to 1 to have the cores back.
      CODEC_DECODE_JOBS: ${CODEC_DECODE_JOBS:-}
      # A restore's wall clock is essentially all download — measured at 5.6
      # MB/s across 3.97 GB, with bursts to 13 and stalls near zero, which is
      # per-connection throttling rather than a full link. This is the ceiling
      # the app aims at; it halves itself whenever YouTube answers with a bot
      # check or a 429, and climbs back after a clean download.
      YTDLP_CONCURRENT_FRAGMENTS: ${YTDLP_CONCURRENT_FRAGMENTS:-32}
      # Restored bytes, kept so a second read of the same file is a disk read.
      # An entry is a whole stored file, so the budget has to hold several of
      # them or every preview pays for another download and decode; 2 GiB was
      # smaller than two bundles.
      CACHE_MAX_BYTES: ${CACHE_MAX_BYTES:-21474836480}
      TZ: ${TZ:-UTC}
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Same image, different entry point. The processors must not share a process
  # with the HTTP server: encoding pins a core for minutes and every request
  # landing there would hang.
  worker:
    build: .
    image: yt-storage:latest
    container_name: yt-storage-worker
    command: ['node', 'dist/worker.js']
    environment: *env
    volumes:
      - data:/data
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  redis-data:
  data:
